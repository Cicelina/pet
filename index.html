<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>像素云朵小狗 · 掌机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Zpix';src:url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/Zpix.ttf') format('truetype');font-display:swap}
:root{--ink:#3c4664;--ink2:#5d7fa3;--shell:#f4e8d2;--paper:#fffaf0;--pink:#f28aa8;--blue:#7fb2d8;--yel:#f2c14e;--grn:#7fc99a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Zpix','DotGothic16','Press Start 2P',monospace,sans-serif;background:#20233a;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:12px 12px;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.px{clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px))}
#device{width:min(100vw,440px);height:100vh;height:100dvh;background:var(--shell);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 0 4px #14162a,0 24px 60px rgba(0,0,0,.5)}
@media(min-width:480px){#device{height:min(94dvh,880px)}}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;flex:none}
.pet-id{display:flex;flex-direction:column;gap:3px}
.name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#petName{font-size:15px;color:var(--ink)}
#stageBadge{font-size:11px;padding:2px 8px;background:var(--paper);border:2px solid var(--ink2);color:var(--ink2);line-height:1.4}
#daysTag{font-size:10px;color:#9aa4b8}
#coinPill{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--ink);padding:2px 7px}
#coinPill canvas{width:12px;height:12px;image-rendering:pixelated}
#coinPill b{font-family:'Press Start 2P',monospace;font-size:9px;color:#b8862e}
.top-btns{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:16px;color:var(--ink2)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.icon-btn canvas{width:24px;height:24px;image-rendering:pixelated}
.icon-btn.pop canvas,.pbtn.pop canvas{animation:pop .28s ease}
@keyframes pop{40%{transform:scale(1.3) rotate(-6deg)}}
.icon-btn:active canvas,.pbtn:active canvas{transform:scale(1.22);filter:drop-shadow(0 0 3px #fff) brightness(1.4)}
#meters{display:flex;gap:7px;padding:5px 14px 6px;flex:none}
.meter{flex:1;background:var(--paper);border:2px solid var(--ink);padding:4px 6px;display:flex;flex-direction:column;gap:4px}
.meter .m-top{display:flex;align-items:center;gap:5px}
.meter canvas{width:14px;height:14px;image-rendering:pixelated}
.meter .m-val{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:8px;color:#8b95ad}
.segs{display:flex;gap:2px}
.segs i{flex:1;height:7px;background:#e6e9f2}
.meter[data-k=hunger] .segs i.on{background:#f28aa8}
.meter[data-k=clean] .segs i.on{background:#7fb2d8}
.meter[data-k=happy] .segs i.on{background:#f2c14e}
.meter[data-k=energy] .segs i.on{background:#7fc99a}
.meter.low{animation:lowBlink 1s steps(2) infinite}
@keyframes lowBlink{50%{border-color:#f28aa8}}
#grille{flex:none;display:flex;justify-content:center;gap:6px;padding:2px 0 4px}
#grille i{width:5px;height:5px;background:#dcccae;border-radius:50%;box-shadow:inset 0 1px 1px #b8a888}
#screenWrap{flex:1;display:flex;align-items:center;justify-content:center;margin:0 12px;min-height:0;padding:2px 0}
#screenInner{position:relative;width:100%;background:#2b3350;padding:8px;border:3px solid #14162a}
#screen{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#grid{position:absolute;inset:8px;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:calc(100%/40) calc(100%/32)}
#flash{position:absolute;inset:8px;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flashA .7s steps(4) forwards}
@keyframes flashA{30%{opacity:.95}100%{opacity:0}}
#boot{position:absolute;inset:8px;background:#0d1020;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#boot .blogo{font-family:'Press Start 2P',monospace;font-size:12px;color:#9fb0d8;letter-spacing:1px;display:flex;align-items:center;gap:6px}
#boot .cur{display:inline-block;width:8px;height:12px;background:#9fb0d8;animation:curBlink .5s steps(2) infinite}
@keyframes curBlink{50%{opacity:0}}
#boot .bsub{font-size:11px;color:#5d6b8f}
#boot.off{animation:bootOut .7s steps(7) forwards}
@keyframes bootOut{65%{opacity:1;background:#fff}100%{opacity:0;visibility:hidden}}
#silk{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 0 0;font-size:9px;color:#b8a888;letter-spacing:1px}
#led{width:7px;height:7px;border-radius:50%;background:#7fc99a;box-shadow:0 0 5px #7fc99a;animation:ledB 2.6s ease-in-out infinite}
@keyframes ledB{50%{opacity:.35}}
body.sick #led{background:#e05a5a;box-shadow:0 0 5px #e05a5a;animation-duration:.6s}
#eggHint{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);z-index:6;background:var(--paper);border:2px solid var(--ink);color:var(--ink);padding:6px 12px;font-size:13px;white-space:nowrap;pointer-events:none;animation:hintBob 1.2s steps(2) infinite}
@keyframes hintBob{50%{transform:translateX(-50%) translateY(-5px)}}
#gameHud{position:absolute;top:32px;right:14px;z-index:6;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ink);display:flex;gap:10px;pointer-events:none;text-shadow:0 0 3px rgba(255,255,255,.9),0 1px 2px rgba(255,255,255,.7)}
#gameHud b{color:#e08a3c;text-shadow:0 0 3px rgba(255,255,255,.95)}
#judgePop{position:absolute;top:26%;left:50%;transform:translate(-50%,-50%);z-index:6;font-family:'Press Start 2P',monospace;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none}
#judgePop.show{animation:judgeA .5s ease-out forwards}
@keyframes judgeA{22%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
#judgePop.p{color:#f2c14e;text-shadow:0 0 6px rgba(242,193,78,.85)}
#judgePop.g{color:#7fb2d8;text-shadow:0 0 5px rgba(127,178,216,.7)}
#judgePop.m{color:#9aa4b8}
#judgePop.r{color:#fff}
#judgePop.f{color:#ffd75e;text-shadow:0 0 8px rgba(255,215,94,.95)}
#toasts{position:absolute;left:0;right:0;bottom:12px;z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(60,70,100,.85);color:#fff;font-size:12px;padding:6px 12px;max-width:92%}
.toast.out{opacity:0;transition:opacity .3s}
.hidden{display:none!important}
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.pbtn{background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;font-family:inherit}
.pbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.pbtn:disabled{opacity:.4;pointer-events:none}
.pbtn canvas{width:26px;height:26px;image-rendering:pixelated}
.pbtn .lbl{font-size:11px;color:var(--ink)}

#foodMenu.open,#shopMenu.open{transform:translateY(0)}
.fm-title{font-size:14px;text-align:center;margin-bottom:10px;color:var(--ink)}
.fm-title b{color:#b8862e;font-family:'Press Start 2P',monospace;font-size:10px}
.fm-title2{font-size:11px;color:#8b95ad;margin:12px 0 6px}
.fm-grid{display:flex;gap:8px;flex-wrap:wrap}
.food{flex:1;min-width:64px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;font-family:inherit}
.food:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.food canvas{width:30px;height:30px;image-rendering:pixelated}
.food b{font-size:12px;color:var(--ink);font-weight:normal}
.food i{font-style:normal;font-size:9px;color:#9aa4b8}
#fmClose,#smClose{position:absolute;top:-16px;right:10px;width:30px;height:30px;background:var(--paper);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.bagEmpty{font-size:11px;color:#9aa4b8;padding:4px 2px}
#modalWrap{position:absolute;inset:0;z-index:30;background:rgba(20,22,42,.6);display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .2s}
#modalWrap.open{opacity:1;pointer-events:auto}
.modal-card{background:var(--paper);border:3px solid var(--ink);padding:20px 18px;width:100%;max-width:320px;max-height:82%;overflow-y:auto}
.modal-card h3{font-size:16px;text-align:center;margin-bottom:12px;font-weight:normal;color:var(--ink)}
.modal-card input{width:100%;border:2px solid var(--ink);padding:9px;font-family:inherit;font-size:15px;text-align:center;background:#fff;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.modal-btn{width:100%;margin-top:10px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:10px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.modal-btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.modal-btn.alt{border-color:#c9cfe0;color:#7b8698;box-shadow:0 4px 0 #c9cfe0}
.modal-btn.danger{border-color:#e0a0a0;color:#c0392b;box-shadow:0 4px 0 #e0a0a0}
.modal-btn.danger.arming{background:#c0392b;border-color:#c0392b;color:#fff;box-shadow:0 4px 0 #8f2b20}
.dest{display:flex;align-items:center;gap:12px;text-align:left}
.dest canvas{flex:none;width:26px;height:26px;image-rendering:pixelated}
.dest i{display:block;font-style:normal;font-size:10px;color:#8b95ad;margin-top:2px}
.menu-grid{display:flex;gap:8px;margin-top:10px}
.mtoggle{flex:1;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:9px 4px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.mtoggle:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.mtoggle.off{color:#9aa4b8;border-color:#b8c0d0;box-shadow:0 3px 0 #b8c0d0}
.help-row{display:flex;gap:9px;font-size:12px;color:#6b7690;line-height:1.6;margin-bottom:9px}
.help-row b{color:var(--ink2);font-weight:normal}
.ver{text-align:center;font-size:10px;color:#b6bfd2;margin-top:10px}
body.egg-mode #meters,body.egg-mode #nav{visibility:hidden}
.con-log{background:#14162a;color:#9ff2c0;font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.9;padding:8px;max-height:140px;min-height:60px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.con-in{width:100%;border:2px solid var(--ink);padding:8px;font-family:'Press Start 2P',monospace;font-size:9px;text-align:left;background:#fff;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text;margin-top:8px}
.cheat-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cheat{flex:1;min-width:70px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:7px 4px;font-family:inherit;font-size:11px;color:var(--ink);cursor:pointer}
.cheat:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.chat-reply{min-height:34px;margin-top:10px;padding:8px;background:#fff;border:2px solid var(--ink);font-size:13px;line-height:1.6;color:#3a6fd8;text-align:center;word-break:break-all}
.chat-btns{display:flex;gap:8px;margin-top:10px}
.chat-btns .modal-btn{margin-top:0}
</style>
</head>

window.addEventListener('error',function(e){var t=document.getElementById('toasts');if(!t)return;var m='⚠ '+e.message+'('+e.lineno+')';if(window.__le===m)return;window.__le=m;var d=document.createElement('div');d.style.cssText='background:#c0392b;color:#fff;padding:6px 10px;font-size:11px;max-width:92%;word-break:break-all';d.textContent=m;t.appendChild(d);setTimeout(function(){d.remove()},8000)});

<script>
'use strict';
/* ===== 工具/存储 ===== */
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms)),midiHz=m=>440*Math.pow(2,(m-69)/12);
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const KEY='cinnamo-pixel-v1';
const S={name:'CINNAMOROLL',stage:0,growth:0,birth:Date.now(),scene:'garden',stats:{hunger:80,happy:80,energy:85,clean:85},sleeping:false,soundOn:true,musicOn:true,tutored:false,poopTip:false,poops:[],sick:false,coins:10,bag:{},pbest:0,last:Date.now()};
function save(){S.last=Date.now();try{store.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(store.getItem(KEY));if(d&&d.stats){Object.assign(S,d);return true}}catch(e){}return false}
function applyOffline(){const f=clamp((Date.now()-S.last)/60000,0,480)*.6;S.stats.hunger=clamp(S.stats.hunger-f*.7,3,100);S.stats.happy=clamp(S.stats.happy-f*.45,3,100);S.stats.clean=clamp(S.stats.clean-f*.18,3,100);if(S.sleeping)S.stats.energy=clamp(S.stats.energy+(Date.now()-S.last)/60000*1.6,0,100);else S.stats.energy=clamp(S.stats.energy-f*.5,3,100)}
function vibe(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
const vb=(ms=12)=>vibe(ms);
/* ===== 音频 ===== */
const AudioFX={ctx:null,master:null,
init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();if(this.ctx.state==='suspended')this.ctx.resume();this.master=this.ctx.createGain();this.master.gain.value=S.soundOn?.5:0;this.master.connect(this.ctx.destination);BGM.start()},
setOn(on){if(this.master)this.master.gain.value=on?.5:0},
tone(f,st,dur,o={}){if(!this.ctx||!S.soundOn)return;if(this.ctx.state==='suspended')this.ctx.resume();const{type='square',vol=.08,slide=null}=o;const t=this.ctx.currentTime+st,os=this.ctx.createOscillator(),g=this.ctx.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(slide)os.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);os.connect(g);g.connect(this.master);os.start(t);os.stop(t+dur+.05)}};
const sfx={tap:()=>AudioFX.tone(660,0,.06,{vol:.06}),
pop:i=>AudioFX.tone(480+i*45,0,.1,{vol:.1,slide:880+i*60}),
eat:()=>{AudioFX.tone(300,0,.08,{vol:.05});AudioFX.tone(250,.12,.08,{vol:.05})},

function consoleExec(raw){const s=raw.trim();if(!s)return;
CONSOLE_LOG.push('&gt; '+s);
const out=m=>CONSOLE_LOG.push(m);
try{
if(s==='help')out('命令: coins N | stage 1-3 | stats N | hunger/happy/energy/clean N | cure | sick | best N | name X | age N | scene garden/room/beach/snow | bag id N | poop | egg | day/dusk/night | music on/off | sound on/off | fly | hop | ai <话> | brain <话> | js <代码> | clear');
else if(s==='clear')CONSOLE_LOG=['(已清空)'];
else if(s.startsWith('js ')){const r=eval(s.slice(3));out('→ '+(r===undefined?'undefined':String(r)))}
else{
const parts=s.split(/\s+/),cmd=parts[0],args=parts.slice(1),n=parseFloat(args[0]);
switch(cmd){
case 'coins':S.coins=Math.max(0,S.coins+(isNaN(n)?0:n|0));updateCoins();out('金币 → '+S.coins);break;
case 'stage':{const st=clamp(n|0,0,3);if(st===0)out('用 egg 回到蛋阶段');else{S.stage=st;S.growth=GROW_TH[st-1]||0;document.body.classList.remove('egg-mode');$('#eggHint').classList.add('hidden');updateHeader();setMood();out('阶段 → '+STAGE_NAME[st])}break}
case 'stats':{const v=isNaN(n)?100:clamp(n,0,100);S.stats.hunger=S.stats.happy=S.stats.energy=S.stats.clean=v;setMood();updateMeters();out('四项属性 → '+v);break}
case 'hunger':S.stats.hunger=isNaN(n)?100:clamp(n,0,100);setMood();updateMeters();out('饱食 → '+Math.round(S.stats.hunger));break;
case 'happy':S.stats.happy=isNaN(n)?100:clamp(n,0,100);setMood();updateMeters();out('快乐 → '+Math.round(S.stats.happy));break;
case 'energy':S.stats.energy=isNaN(n)?100:clamp(n,0,100);setMood();updateMeters();out('精力 → '+Math.round(S.stats.energy));break;
case 'clean':S.stats.clean=isNaN(n)?100:clamp(n,0,100);setMood();updateMeters();out('清洁 → '+Math.round(S.stats.clean));break;
case 'cure':S.sick=false;applySickUI();out('已治愈');break;
case 'sick':S.sick=true;applySickUI();out('已致病');break;
case 'best':S.pbest=Math.max(0,n|0);out('跳跳乐最佳 → '+S.pbest);break;
case 'name':S.name=args.join(' ').slice(0,16)||S.name;updateHeader();out('名字 → '+S.name);break;
case 'age':{const a2=parseInt(args[0],10);if(isNaN(a2)){out('用法: age 天数（0=归零）');break}
if(a2<=0){S.birth=Date.now();out('年龄已归零');break}
S.birth=Date.now()-(clamp(a2,1,9999)-1)*86400000;updateHeader();out('年龄 → 陪伴 '+clamp(a2,1,9999)+' 天');break}
case 'scene':if(SCENES[args[0]]){S.scene=args[0];out('场景 → '+SCENES[args[0]].name)}else out('场景: garden/room/beach/snow');break;
case 'bag':{const id=args[0],cnt=parseInt(args[1]||1)||1;if(PRICES[id]){S.bag[id]=(S.bag[id]||0)+cnt;renderBagMenu();out(id+' ×'+cnt+' 已入包')}else out('id: icecream/pudding/bento/starcookie');break}
case 'poop':spawnPoop();out('已生成便便');break;
case 'egg':S.stage=0;S.growth=0;eggTaps=0;updateHeader();document.body.classList.add('egg-mode');$('#eggHint').classList.remove('hidden');out('回到蛋（点三下孵化）');break;
case 'day':case 'dusk':case 'night':phase=cmd;snapPhase();out('时段 → '+cmd);break;
case 'music':S.musicOn=args[0]!=='off';applyAudio();out('音乐 '+(S.musicOn?'on':'off'));break;
case 'sound':S.soundOn=args[0]!=='off';applyAudio();out('音效 '+(S.soundOn?'on':'off'));break;
case 'fly':if(S.stage===3){flyOn=true;setTimeout(()=>flyOn=false,3000);out('飞行 3 秒')}else out('需要成年阶段');break;
case 'hop':hopNow();out('跳一下');break;
case 'ai':{const q=args.join(' ');if(!q){out('用法: ai 你好');break}
if(!aiReady()){out('先在系统菜单启用AI');break}
out('思考中…');aiAsk(q).then(r=>{CONSOLE_LOG.push('→ '+r);renderConsole();speakType(r)}).catch(e=>out('AI错误：'+e.message));break}
case 'brain':{const q=args.join(' ');if(!q){out('用法: brain 你好呀');break}
if(!aiReady()){out('先在系统菜单启用AI');break}
out('🧠 大脑决策中…');
aiBrain(q).then(r=>{CONSOLE_LOG.push('→ '+r);renderConsole()}).catch(e=>out('AI错误：'+e.message));break}
default:out('未知命令，输入 help 查看')}}
}catch(e){out('错误：'+e.message)}
save();renderConsole()}

let idleTimer=null;
function scheduleIdle(){clearTimeout(idleTimer);
idleTimer=setTimeout(async()=>{
if(S.stage===0||busy||S.sleeping||outing){scheduleIdle();return}
if(S.sick){if(Math.random()<.5)speak(LINES.sick[Math.random()*LINES.sick.length|0]);scheduleIdle();return}
const r=Math.random();
if(r<.32)await walkTo(rnd(48,112));
else if(r<.5&&S.stage>=2)hopNow();
else if(r<.62){const pools=['idle','idle','idle','bored','afterEat','afterWash','pet','idle'];
const P=LINES[pools[Math.random()*pools.length|0]];speakType(P[Math.random()*P.length|0])}
else if(r<.74&&S.stage>=3){await walkTo(BALL_X+22);await sleepMs(400);hopNow()}
else if(r<.82&&S.stage===3&&S.stats.happy>85){flyOn=true;fxRain('note',3,petX,GY-50,14);await sleepMs(3000);flyOn=false}
scheduleIdle()},rnd(5000,11000))}

const k=3/60;
if(!S.sleeping){S.stats.hunger=clamp(S.stats.hunger-.7*k,0,100);S.stats.happy=clamp(S.stats.happy-.45*k,0,100);S.stats.energy=clamp(S.stats.energy-.5*k,0,100);S.stats.clean=clamp(S.stats.clean-.18*k,0,100)}

if(S.poops.length){S.stats.clean=clamp(S.stats.clean-.22*S.poops.length*k,0,100);S.stats.happy=clamp(S.stats.happy-.12*S.poops.length*k,0,100)}
if(S.sick){S.stats.energy=clamp(S.stats.energy-.35*k,0,100);S.stats.happy=clamp(S.stats.happy-.3*k,0,100)}
if(!S.sleeping&&!game&&!bathActive&&!outing){if(Math.random()<((Date.now()-lastEatAt<30000)?.10:.035))spawnPoop()}
if(!S.sick&&!S.sleeping&&!game&&!bathActive&&!outing&&S.stage>0){
if((S.stats.hunger<=12||S.stats.clean<=10||S.poops.length>=3)&&Math.random()<.06)getSick()}

function inPet(lx,ly){if(S.stage===0)return false;const sz=SIZES[S.stage];return lx>petX-sz.w/2-3&&lx<petX+sz.w/2+3&&ly>GY-sz.h-4&&ly<GY+2}

const bh=window.__btnHit;
if(bh&&p.x>=bh.x&&p.x<=bh.x+bh.w&&p.y>=bh.y&&p.y<=bh.y+bh.h){
vb(15);sfx.tap();btnFlash[bh.kind]=.25;
if(bh.kind==='home'){if(outing&&!game)endOuting()}
else if(game){if(game.type==='park')endParkour();else endGame()}
return}
if(game){
if(game.type==='rhythm'){hitLane(p.x<53?0:p.x<107?1:2);return}
if(game.type==='park'){pkJump();return}
for(let i=game.bub.length-1;i>=0;i--){const b=game.bub[i];

return}
if(outing){
if(outing.place==='park'){
for(let i=outing.fly.length-1;i>=0;i--){const b=outing.fly[i];

if(inPet(p.x,p.y))petIt(p.x,p.y);return}
if(outing.place==='market'){openShop();return}
if(p.x>6&&p.x<44&&p.y>40&&p.y<100){vibe(12);startParkour();return}
if(p.x>124&&p.x<158&&p.y>36&&p.y<100){claw();return}
startGame();return}
if(suds.length>0){washAt(p.x,p.y);return}
if(S.poops.length>0)for(let i=S.poops.length-1;i>=0;i--){const pp=S.poops[i];

if(S.stage===0){if(p.x>62&&p.x<98&&p.y>74&&p.y<112)eggTap();return}
if(S.sleeping){toast('呼…呼…（睡着啦）');return}
if(inPet(p.x,p.y))petIt(p.x,p.y)});

const had=load();if(had)applyOffline();

S.bag=Object.assign({icecream:0,pudding:0,bento:0,starcookie:0},S.bag||{});
if(!SCENES[S.scene]||SCENES[S.scene].need>S.stage)S.scene='garden';
applySickUI();snapPhase();updateHeader();updateMeters();renderBagMenu();fitScreen();ctx.imageSmoothingEnabled=false;
if(!had||S.stage===0){S.stage=0;document.body.classList.add('egg-mode');$('#eggHint').classList.remove('hidden')}
else{$('#eggHint').classList.add('hidden');
if(S.sleeping)toast('呼…呼…（它还在睡）');
if(S.sick)setTimeout(()=>toast('它还在生病，点「治疗」喂药',3000),2100);
setMood();if((Date.now()-S.last)/60000>30)setTimeout(()=>{speak(LINES.greet[Math.random()*LINES.greet.length|0],2600)},2400);scheduleIdle()}
setTimeout(()=>{const b=$('#boot');if(b){b.classList.add('off');setTimeout(()=>b.remove(),780)}},1200);
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frameLoop)});save();
</script>
